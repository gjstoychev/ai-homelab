---
- name: Install the sandbox dependencies and jq from Ubuntu
  ansible.builtin.apt:
    name:
      - bubblewrap
      - socat
      - jq # used by the user's status line script
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Claude Code repository signing key
  ansible.builtin.copy:
    src: claude-code.asc
    dest: /etc/apt/keyrings/claude-code.asc
    owner: root
    group: root
    mode: "0644"
  notify: Refresh the apt cache

- name: Add the Claude Code apt repository (stable channel)
  ansible.builtin.copy:
    src: claude-code.sources
    dest: /etc/apt/sources.list.d/claude-code.sources
    owner: root
    group: root
    mode: "0644"
  notify: Refresh the apt cache

- name: Pin claude-code to the chosen version
  ansible.builtin.template:
    src: claude-code.pref.j2
    dest: /etc/apt/preferences.d/claude-code
    owner: root
    group: root
    mode: "0644"

# The package must be visible before the install task, not at the end of the play.
- name: Refresh the apt cache now if the repository changed
  ansible.builtin.meta: flush_handlers

- name: Install Claude Code
  ansible.builtin.apt:
    name: "claude-code={{ claude_code_version }}"
    state: present

- name: Copy bwrap to a dedicated binary for Claude Code
  ansible.builtin.copy:
    src: /usr/bin/bwrap
    dest: /usr/local/bin/claude-bwrap
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Install AppArmor profile that allows user namespaces for the copy
  ansible.builtin.copy:
    src: claude-bwrap
    dest: /etc/apparmor.d/claude-bwrap
    owner: root
    group: root
    mode: "0644"
  notify: Reload claude-bwrap AppArmor profile

# The file alone proves nothing: a profile removed from the kernel (apparmor_parser -R)
# leaves the file unchanged, and every sandboxed command then fails.
- name: Read the AppArmor profiles loaded in the kernel
  ansible.builtin.command: cat /sys/kernel/security/apparmor/profiles
  register: claude_code_loaded_profiles
  changed_when: false
  check_mode: false

- name: Load the claude-bwrap profile when it is missing from the kernel
  ansible.builtin.command:
    cmd: apparmor_parser -r /etc/apparmor.d/claude-bwrap
    # With removes, check mode reports "would run" as changed instead of skipping.
    removes: /etc/apparmor.d/claude-bwrap
  when: "'claude-bwrap' not in (claude_code_loaded_profiles.stdout_lines | map('regex_replace', ' \\(.*\\)$', '') | list)"

- name: Create the managed settings directory
  ansible.builtin.file:
    path: /etc/claude-code
    state: directory
    owner: root
    group: root
    mode: "0755"

# Must stay world-readable: Claude Code silently starts without a managed file it cannot read.
- name: Install Claude Code managed settings
  ansible.builtin.copy:
    src: managed-settings.json
    dest: /etc/claude-code/managed-settings.json
    owner: root
    group: root
    mode: "0644"
