---
- name: Install the build tools from Ubuntu
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
      - ninja-build
      - git
      - libssl-dev # llama.cpp's HTTPS support (model downloads with -hf)
      - python3-venv # venv for llama.cpp's Python tools (the MoE cache tuner)
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the NVIDIA CUDA repository signing key
  ansible.builtin.copy:
    src: nvidia-cuda.asc
    dest: /etc/apt/keyrings/nvidia-cuda.asc
    owner: root
    group: root
    mode: "0644"
  notify: Refresh the apt cache

# The preferences go in before the repository, so no apt run ever sees the repository unpinned.
- name: Rank NVIDIA's repository below Ubuntu and keep NCCL on the toolkit's CUDA version
  ansible.builtin.template:
    src: nvidia-cuda.pref.j2
    dest: /etc/apt/preferences.d/nvidia-cuda
    owner: root
    group: root
    mode: "0644"

- name: Add the NVIDIA CUDA apt repository (Ubuntu 24.04, x86_64)
  ansible.builtin.copy:
    src: nvidia-cuda.sources
    dest: /etc/apt/sources.list.d/nvidia-cuda.sources
    owner: root
    group: root
    mode: "0644"
  notify: Refresh the apt cache

# The packages must be visible before the install tasks, not at the end of the play.
- name: Refresh the apt cache now if the repository changed
  ansible.builtin.meta: flush_handlers

# The driver comes from Ubuntu (nvidia-driver-580-server-open). The CUDA repository also
# carries drivers; a dependency that pulled one in would replace the running driver's
# user-space libraries. Simulate first and stop before anything is installed.
- name: Simulate the toolchain install
  ansible.builtin.command: # noqa: command-instead-of-module (the apt module has no dry run that lists packages)
    argv: "{{ ['apt-get', '--simulate', '--no-install-recommends', 'install'] + llama_cpp_cuda_packages }}"
  register: llama_cpp_apt_simulation
  changed_when: false
  check_mode: false

- name: Stop if the install would touch the NVIDIA driver
  ansible.builtin.assert:
    that: llama_cpp_apt_simulation.stdout is not search('^Inst (nvidia-|libnvidia-|xserver-xorg-video-nvidia)', multiline=True)
    fail_msg: >-
      The CUDA toolchain would install or replace NVIDIA driver packages; nothing was installed.
      Check: apt-get -s install {{ llama_cpp_cuda_packages | join(' ') }}
    quiet: true

- name: Install the CUDA build toolchain and NCCL (no driver)
  ansible.builtin.apt:
    name: "{{ llama_cpp_cuda_packages }}"
    state: present
    install_recommends: false
