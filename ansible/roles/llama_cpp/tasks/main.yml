---
# Configuration only. The packages are installed by hand, one command at a time (README,
# "Installing by hand"); the role checks that they are there and never installs them.
- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the NVIDIA CUDA repository signing key
  ansible.builtin.copy:
    src: nvidia-cuda.asc
    dest: /etc/apt/keyrings/nvidia-cuda.asc
    owner: root
    group: root
    mode: "0644"
  notify: Refresh the apt cache

# The preferences go in before the repository, so no apt run ever sees the repository unpinned.
- name: Rank NVIDIA's repository below Ubuntu and keep NCCL on the toolkit's CUDA version
  ansible.builtin.template:
    src: nvidia-cuda.pref.j2
    dest: /etc/apt/preferences.d/nvidia-cuda
    owner: root
    group: root
    mode: "0644"

- name: Add the NVIDIA CUDA apt repository (Ubuntu 24.04, x86_64)
  ansible.builtin.copy:
    src: nvidia-cuda.sources
    dest: /etc/apt/sources.list.d/nvidia-cuda.sources
    owner: root
    group: root
    mode: "0644"
  notify: Refresh the apt cache

- name: Read the installed packages
  ansible.builtin.package_facts:
    manager: apt

- name: Check that the build toolchain is installed
  ansible.builtin.assert:
    that: llama_cpp_missing | length == 0
    fail_msg: >-
      Not installed: {{ llama_cpp_missing | join(' ') }}. The role installs nothing; install them by hand
      (README, "Installing by hand"), dry run first:
      sudo apt-get -s --no-install-recommends install {{ llama_cpp_missing | join(' ') }}
    quiet: true
  vars:
    llama_cpp_missing: "{{ (llama_cpp_ubuntu_packages + llama_cpp_cuda_packages) | reject('in', ansible_facts.packages) | list }}"

- name: Check that NCCL is the build for the toolkit's CUDA version
  ansible.builtin.assert:
    that: ansible_facts.packages.libnccl2 | map(attribute='version') | select('search', llama_cpp_nccl_suffix) | list | length > 0
    fail_msg: >-
      libnccl2 {{ ansible_facts.packages.libnccl2 | map(attribute='version') | join(', ') }} is not a +cuda{{ llama_cpp_cuda_version }}
      build; check /etc/apt/preferences.d/nvidia-cuda and apt-cache policy libnccl2.
    quiet: true
  vars:
    llama_cpp_nccl_suffix: "{{ '\\+cuda' ~ (llama_cpp_cuda_version | regex_escape) ~ '$' }}"
