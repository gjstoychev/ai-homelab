# Managed by Ansible (role ollama). Lab 0b.
[Unit]
# At most 5 starts in 5 minutes, then the unit stays failed. The default
# (5 in 10s) never triggers with RestartSec=3.
StartLimitIntervalSec=5min
StartLimitBurst=5
# DeviceAllow= groups must exist when the unit starts, or they are dropped.
# udev loads nvidia_uvm at boot; this makes sure it is loaded before Ollama.
Wants=modprobe@nvidia_uvm.service
After=modprobe@nvidia_uvm.service

[Service]
Restart=on-failure
# An OOM kill takes only the victim (normally the model runner); the server stays up.
OOMPolicy=continue
NoNewPrivileges=yes
PrivateTmp=yes
# The whole file system read-only, except what Ollama writes: models, cache and
# its key under ~/.ollama, and the CUDA compute cache (~/.nv; "-": may not exist).
# Its home is /usr/share/ollama, not under /home.
ProtectSystem=strict
ReadWritePaths=/usr/share/ollama/.ollama -/usr/share/ollama/.nv
ProtectHome=yes
# Devices: only the NVIDIA driver (major "nvidia": cards, nvidiactl, modeset)
# and unified memory. Applies to the whole cgroup, ExecStartPre=+ included.
# PrivateDevices=yes would hide /dev/nvidia*.
DevicePolicy=closed
DeviceAllow=char-nvidia rw
DeviceAllow=char-nvidia-uvm rw
