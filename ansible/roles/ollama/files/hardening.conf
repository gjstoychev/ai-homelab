# Managed by Ansible (role ollama). Lab 0b.
[Unit]
# At most 5 starts in 5 minutes, then the unit stays failed. The default
# (5 in 10s) never triggers with RestartSec=3.
StartLimitIntervalSec=5min
StartLimitBurst=5
# DeviceAllow= groups must exist when the unit starts, or they are dropped.
# udev loads nvidia_uvm at boot; this makes sure it is loaded before Ollama.
Wants=modprobe@nvidia_uvm.service
After=modprobe@nvidia_uvm.service

[Service]
Restart=on-failure
# An OOM kill takes only the victim (normally the model runner); the server stays up.
OOMPolicy=continue
NoNewPrivileges=yes
PrivateTmp=yes
# The whole file system read-only, except what Ollama writes: models, cache and
# its key under ~/.ollama, and the CUDA compute cache (~/.nv; "-": may not exist).
# Its home is /usr/share/ollama, not under /home.
ProtectSystem=strict
ReadWritePaths=/usr/share/ollama/.ollama -/usr/share/ollama/.nv
ProtectHome=yes
# Devices: only the NVIDIA driver (major "nvidia": cards, nvidiactl, modeset)
# and unified memory. Applies to the whole cgroup, ExecStartPre=+ included.
# PrivateDevices=yes would hide /dev/nvidia*.
DevicePolicy=closed
DeviceAllow=char-nvidia rw
DeviceAllow=char-nvidia-uvm rw
# Resource limits (Lab 0b, step 7 and 12): most of Ollama's memory is page cache
# of model files, which MemoryHigh reclaims; MemoryMax is the last line of defence.
# One runner on the CPU uses 8 threads (~800%); 16 of 28 CPUs at most.
MemoryHigh=16G
MemoryMax=32G
# Without it MemoryMax limits RAM only and the rest goes to swap (8 GiB here).
MemorySwapMax=0
CPUQuota=1600%
TasksMax=512
# Kernel, processes and privileges (Lab 0b, step 13). Ollama runs as user
# ollama and needs no capabilities; ExecStartPre=+ is not affected.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
# Also implies DeviceAllow=char-rtc r.
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
PrivateMounts=yes
CapabilityBoundingSet=
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
RemoveIPC=yes
UMask=0027
# Tried one at a time before going in (Lab 0b, step 15). ProcSubset=pid is left
# out: it hides /proc/meminfo, and Ollama then cannot see the system memory.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
# Unlisted system calls fail with EPERM instead of killing the process (SIGSYS).
SystemCallFilter=@system-service
# A later ~ line removes calls from the allow list above (man systemd.exec).
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
PrivateUsers=yes
MemoryDenyWriteExecute=yes
